[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pn-junction-diagnostics"
version = "0.1.0"
description = "Validated silicon junction electrostatics and compact diode parameter estimation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Morad Atabrahim"}]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2", "matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/Atabrahim/pn-junction-diagnostics"
Issues = "https://github.com/Atabrahim/pn-junction-diagnostics/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
