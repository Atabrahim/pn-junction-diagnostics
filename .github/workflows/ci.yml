name: Scientific validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel with test dependencies
        run: python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel) + '[dev]'])"
      - name: Check dependencies and source quality
        run: |
          python -m pip check
          ruff check .
          ruff format --check .
      - name: Test the installed package
        run: python -m pytest -q
      - name: Verify API outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -c "from pn_junction import solve_equilibrium; result = solve_equilibrium(); assert result.scaled_residual < 1e-9; print(result.junction.built_in_voltage_V)"
      - name: Verify CLI outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          pn-junction --version
          pn-junction simulate --output junction.csv
          pn-junction fit "${{ github.workspace }}/data/synthetic_diode.csv" --output diode-fit.json
      - name: Reproduce scientific figures and numerical checks
        run: python examples/reproduce.py --output outputs/ci-reproduced
